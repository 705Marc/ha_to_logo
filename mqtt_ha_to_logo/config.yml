name: "MQTT HA to LOGO"
description: "Konvertiert MQTT-Nachrichten von Home Assistant für die Siemens LOGO!"
version: "1.0.0"
slug: "mqtt_ha_to_logo"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
services:
  - mqtt:need
options:
  mqtt_broker: "auto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  mqtt_broker: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: str?
